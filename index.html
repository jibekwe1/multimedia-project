<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Keyboard DualShock</title>
<link rel="stylesheet" href="style.css">

<div id="box">
  <div class="sticks">
    <div class="stick" id="left">
      <span class="key up" data-key="w">w</span>
      <span class="key left" data-key="a">a</span>
      <span class="key down" data-key="s">s</span>
      <span class="key right" data-key="d">d</span>
      <div class="ring"><div class="dot"></div></div>
    </div>
    <div class="stick" id="right">
      <span class="key up" data-key="ArrowUp">↑</span>
      <span class="key left" data-key="ArrowLeft">←</span>
      <span class="key down" data-key="ArrowDown">↓</span>
      <span class="key right" data-key="ArrowRight">→</span>
      <div class="ring"><div class="dot"></div></div>
    </div>
  </div>
  <div class="buttons">
    <div class="button" data-key="o">○<small>o</small></div>
    <div class="button" data-key="x">✕<small>x</small></div>
    <div class="button" data-key="t">△<small>t</small></div>
    <div class="button" data-key="q">□<small>q</small></div>
  </div>
</div>

<p>Click the page, then press W A S D (left stick), the arrow keys (right stick), and O X T Q (buttons).</p>

<script src="app.js"></script>
